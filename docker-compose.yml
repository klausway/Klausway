services:
  db:
    image: postgres:16-alpine
    container_name: klausway-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: klausway
      POSTGRES_PASSWORD: klausway
      POSTGRES_DB: klausway_website
    volumes:
      - klausway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klausway -d klausway_website"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  klausway_pgdata:
